name: ci-debug
on: workflow_dispatch
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0 || true
      - name: Diagnostics
        continue-on-error: true
        run: |
          sysctl -a 2>/dev/null | grep -i -E 'userns|user_ns|apparmor' || true
          cat /sys/kernel/security/lsm || true
          echo "--- unshare plain"; unshare -Ur sh -c 'echo plain-ok; cat /proc/self/status | grep -i cap' || true
          echo "--- bwrap capdrop nested"; bwrap --ro-bind / / --dev /dev --unshare-user --cap-drop ALL --proc /proc --unshare-pid unshare -Ur echo nested-ok || true
          echo "--- bwrap no capdrop nested"; bwrap --ro-bind / / --dev /dev --unshare-user --proc /proc --unshare-pid unshare -Ur echo nested-nocapdrop-ok || true
          echo "--- bwrap bind proc nested"; bwrap --ro-bind / / --dev /dev --unshare-user --cap-drop ALL --bind /proc /proc --unshare-pid unshare -Ur echo nested-bindproc-ok || true
